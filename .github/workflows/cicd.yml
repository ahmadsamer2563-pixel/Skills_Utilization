name: Project3 CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ahmadsamer2563-pixel/skills_utilization

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # SECURITY - BANDIT
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r . \
            --exclude ./actions-runner,./.git \
            -ll

      # -------------------------
      # GHCR
      # -------------------------
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

      # -------------------------
      # DEPLOYMENT
      # -------------------------
      - name: Deploy Project3 backend
        run: |
          cd /home/aau/Desktop/Project3
          ./vault/vaultscript.ssh

      - name: Check containers
        run: |
          docker compose -f /home/aau/Desktop/Project3/docker-compose.yml ps

      - name: Wait for backend
        run: |
          echo "Waiting for SkillMatch backend..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5000 > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Backend not ready yet... attempt $i/30"
            sleep 2
          done

          echo "Backend failed to become ready."
          docker logs project3-backend --tail 50
          exit 1

      - name: Test backend
        run: |
          curl --fail http://localhost:5000
