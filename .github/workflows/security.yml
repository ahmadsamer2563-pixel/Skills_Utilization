name: Project3 Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: self-hosted

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # CREATE RESULTS DIRECTORY
      # =========================
      - name: Create security results directory
        run: |
          mkdir -p security-results

      # =========================
      # BANDIT
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          echo "===== BANDIT SECURITY SCAN =====" > security-results/bandit.txt
          echo "Scan date: $(date)" >> security-results/bandit.txt
          echo "" >> security-results/bandit.txt

          bandit -r . \
            --exclude ./.git \
            >> security-results/bandit.txt 2>&1 || true

          echo ""
          echo "Bandit scan completed."
          echo "Results saved to security-results/bandit.txt"

      # =========================
      # HADOLINT
      # =========================
      - name: Run Hadolint
        run: |
          echo "===== HADOLINT DOCKERFILE SCAN =====" > security-results/hadolint.txt
          echo "Scan date: $(date)" >> security-results/hadolint.txt
          echo "" >> security-results/hadolint.txt

          docker run --rm -i hadolint/hadolint \
            hadolint - \
            < Dockerfile \
            >> security-results/hadolint.txt 2>&1 || true

          echo ""
          echo "Hadolint scan completed."
          echo "Results saved to security-results/hadolint.txt"

      # =========================
      # TRUFFLEHOG
      # =========================
      - name: Run TruffleHog
        run: |
          echo "===== TRUFFLEHOG SECRET SCAN =====" > security-results/trufflehog.txt
          echo "Scan date: $(date)" >> security-results/trufflehog.txt
          echo "" >> security-results/trufflehog.txt

          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --no-update \
            >> security-results/trufflehog.txt 2>&1 || true

          echo ""
          echo "TruffleHog scan completed."
          echo "Results saved to security-results/trufflehog.txt"

      # =========================
      # DISPLAY RESULTS
      # =========================
      - name: Display Bandit results
        run: |
          cat security-results/bandit.txt || true

      - name: Display Hadolint results
        run: |
          cat security-results/hadolint.txt || true

      - name: Display TruffleHog results
        run: |
          cat security-results/trufflehog.txt || true

      # =========================
      # SAVE RESULTS ON SERVER
      # =========================
      - name: Save security results on server
        run: |
          mkdir -p /home/aau/Desktop/Project3/security-results

          cp security-results/bandit.txt \
            /home/aau/Desktop/Project3/security-results/bandit.txt

          cp security-results/hadolint.txt \
            /home/aau/Desktop/Project3/security-results/hadolint.txt

          cp security-results/trufflehog.txt \
            /home/aau/Desktop/Project3/security-results/trufflehog.txt

          echo "Security results saved on server."

      # =========================
      # UPLOAD RESULTS
      # =========================
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: security-results/
          retention-days: 30
